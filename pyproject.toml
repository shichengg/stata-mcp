[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stata-gui-mcp"
version = "1.1.0"
description = "Control the Stata GUI through MCP on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "shichengg" },
]
keywords = ["stata", "mcp", "model-context-protocol", "automation", "econometrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1,<2",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<9",
  "twine>=6,<7",
]

[project.urls]
Homepage = "https://github.com/shichengg/stata-mcp"
Repository = "https://github.com/shichengg/stata-mcp"
Issues = "https://github.com/shichengg/stata-mcp/issues"

[project.scripts]
stata-gui-mcp = "stata_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
